
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sip & Roll | Booking</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Book with Sip & Roll</h1>
  </header>

  <section>
    <h2>Request a Quote</h2>
    <form name="quote-request" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" enctype="multipart/form-data">
      <input type="hidden" name="form-name" value="quote-request">
      <p hidden>
        <label>Don’t fill this out if you're human: <input name="bot-field"></label>
      </p>

      <label for="name">Name:</label><br>
      <input type="text" id="name" name="name" required><br><br>

      <label for="email">Email:</label><br>
      <input type="email" id="email" name="email" required><br><br>

      <label for="event">Event Type:</label><br>
      <input type="text" id="event" name="event"><br><br>

      <label for="guests">Guest Count:</label><br>
      <input type="number" id="guests" name="guests"><br><br>

      <label for="package">Select a Package:</label><br>
      <select id="package" name="package">
        <option value="full-service">Full-Service Mobile Bar</option>
        <option value="bartender-only">Bartender-Only Service</option>
      </select><br><br>

      <label for="message">Message / Custom Requests:</label><br>
      <textarea id="message" name="message" rows="5" cols="40"></textarea><br><br>

      <label for="file">Upload a Menu or Floorplan (optional):</label><br>
      <input type="file" id="file" name="file"><br><br>

      <button type="submit">Submit Quote Request</button>
    </form>
  </section>

  <section style="margin-top: 40px;">
    <h2>Schedule a Consultation</h2>
    <iframe src="https://calendly.com/sipandroll/event-consultation" width="100%" height="600" frameborder="0" scrolling="no"></iframe>
  </section>

  <section style="margin-top: 40px;">
    <h2>Submit Your Event Request & Sign Agreement</h2>
    <iframe title="Sip & Roll Booking Form" src="https://form.jotform.com/241004123291036" width="100%" height="800" frameborder="0" scrolling="yes"></iframe>
  </section>

  <footer>
    <p>&copy; 2025 Sip & Roll. All rights reserved.</p>
  </footer>
</body>
</html>
